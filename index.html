<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShatterSand</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0f;
        color: #e8e8f0;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        box-shadow: 0 0 0 1px #23232e, 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #05060a;
        cursor: crosshair;
      }
      #hud {
        position: absolute;
        top: 8px;
        left: 8px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        user-select: none;
      }
      #hud .stat {
        color: #9fe0a0;
      }
      #palette {
        position: absolute;
        bottom: 8px;
        left: 8px;
        display: flex;
        gap: 6px;
        pointer-events: auto;
        user-select: none;
      }
      #palette button {
        all: unset;
        cursor: pointer;
        padding: 4px 8px;
        font: inherit;
        font-size: 12px;
        border: 1px solid #2a2a38;
        border-radius: 4px;
        background: #14141c;
        color: #cfcfe0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #palette button.active {
        border-color: #ffd479;
        background: #262013;
        color: #ffe9b8;
      }
      #palette .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      #help {
        position: absolute;
        top: 8px;
        right: 8px;
        text-align: right;
        font-size: 11px;
        color: #7a7a8c;
        pointer-events: none;
        user-select: none;
        line-height: 1.6;
      }
      #help b {
        color: #b8b8cc;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="screen"></canvas>
        <div id="hud"></div>
        <div id="help"></div>
        <div id="palette"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
